{{ define "main" }}
  <article class="post">
    <header>
      <h1>{{ .Title }}</h1>
      <p class="muted">{{ .Date.Format "Jan 2, 2006" }}</p>
      {{ partial "langswitch.html" . }}
      {{ with .Params.subtitle }}<p class="subtitle">{{ . }}</p>{{ end }}
      {{ with .Params.tags }}
        <ul class="tags">
          {{ range . }}
            <li><a href="{{ "tags/" | relLangURL }}{{ . | urlize }}">{{ . }}</a></li>
          {{ end }}
        </ul>
      {{ end }}
    </header>
    <div class="post-body prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
