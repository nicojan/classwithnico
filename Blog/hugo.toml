baseURL = "https://classwith.nicojan.com/blog/"
title = "Class with Nico — Blog"
languageCode = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
timeZone = "America/Vancouver"

# Hugo Theme Dream
[module]
  [[module.imports]]
    path = "github.com/g1eny0ung/hugo-theme-dream"

publishDir = "../Development/blog"

[permalinks]
posts = "/:year/:month/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

canonifyURLs = true
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority   = 0.5
  filename   = "sitemap.xml"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term     = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"

[frontmatter]
  date  = ["date", "publishDate", "lastmod"]
  lastmod = ["lastmod", ":git", "date", "publishDate"]
  publishDate = ["publishDate", "date"]

[minify]
  minifyOutput = true

# ---- Multilingual ----
[languages]

  [languages.en]
    languageName = "English"
    languageCode = "en-CA"
    weight = 1
    contentDir = "content/en"
    title = "Class with Nico — Blog"
    [languages.en.params]
      locale = "en-CA"

  [languages.zh]
    languageName = "中文（繁體）"
    languageCode = "zh-Hant-TW"
    weight = 2
    contentDir = "content/zh"
    title = "Class with Nico — 部落格"
    [languages.zh.params]
      locale = "zh-Hant-TW"

# ---- Dream Theme Params ----
[params]
  author = "Nico Jan"
  authorURL = "https://classwith.nicojan.com/about.html"
  headerTitle = "Class with Nico"
  siteStartYear = 2025
  og_image = "/images/showreel.png"
  logo = "/images/logo_simple.svg"

  # Dream theme appearance
  lightTheme = "emerald"
  darkTheme = "forest"

  # Post display
  showTableOfContents = true
  showSummaryCoverInPost = true

  relme = [
    "https://instagram.com/classwithnico",
    "https://m.me/classwithnico",
    "https://www.youtube.com/@classwithnico",
    "https://wa.me/message/WPWMHXAIHI5CI1",
  ]

  [params.advanced]
    customJS = []
    customCSS = []

# ---- Google Analytics ----
[services]
  [services.googleAnalytics]
    ID = "G-2C6ERNQ5SG"

paginate = 10
paginatePath = "page"
summaryLength = 24
