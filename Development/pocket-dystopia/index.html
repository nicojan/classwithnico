<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pocket Dystopia</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="intro">
    <div class="hero">
      <h1 class="flicker">POCKET DYSTOPIA</h1>
    </div>

    <div class="btn-container">
      <button onclick="generateNightmare()">[ ROLL THE DIE ]</button>
    </div>

    <div class="container">
      <div id="output" class="result-area"></div>
    </div>

    <script>
      // DATA SETS - The Satirical Collection
      const sideChars = [
        "loyal but terrified (Red Shirt #1)",
        "secretly resistance (has a cool tattoo)",
        "annoyingly optimistic despite acid rain",
        "scavenger who hoards spoons",
        "ex-Gov worker: 'I shouldn't say this...'",
        "medic who uses dirty bandages",
        "elder: 'I remember trees...'",
        "tech-kid (fixes fusion drives with gum)",
        "silent brooding type (low budget)",
        "citizen who reads the Terms of Service",
        "the musician who is tone deaf",
      ];

      const protagTraits = [
        "found a book, now thinks they are 'The One'",
        "too empathetic for this cruel world",
        "parkour expert (run. jump. repeat.)",
        "can hack the mainframe in < 3 seconds",
        "rebellious streak (hates beige)",
        "obnoxious sense of justice",
        "thinking fast, acting stupid",
        "the 'Chosen One' (Generic Variant B)",
        "has a robot arm or glowy eye",
        "super young but somehow can fix and do everything",
        "must find THE TRUTH (Caps Lock on)",
      ];

      const protagWeakness = [
        "trusts the villain immediately",
        "abandonment issues (classic)",
        "guilt over Chapter 1",
        "punches walls when angry",
        "physically frail but has 'heart'",
        "thinks they are invincible (spoiler: no)",
        "will die for their cat",
        "cannot follow simple instructions",
        "panic attacks triggered by beeping",
        "trackable via their microchip",
      ];

      const antagonist = [
        "chad dictator with great hair",
        "a corrupted leader that takes control of a city",
        "tech-bro uploading brains to the cloud",
        "angry general shouting at screens",
        "CEO of Water™",
        "scientist: 'I'm saving humanity by killing it'",
        "an evil robot who wants to destroy the world",
        "politician hiding aliens",
        "an alien emperor who wants to take over the planet",
        "AI who decides that in order to save humanity they must destroy humanity",
        "the giant dragon who is, for some reason, always evil",
      ];

      const antagWeakness = [
        "monologues their plan",
        "ignored 'The Power of Friendship'",
        "forgot to update the firewall",
        "minions are unionizing",
        "OCD about symmetry",
        "fragile ego (hates bad Yelp reviews)",
        "actually 3 kids in a trench coat",
        "secretly loves the hero's mum",
        "hiding a mutated tail",
        "relies on Windows 95",
      ];

      const settings = [
        "Sector 7 (It's always Sector 7)",
        "the tunnels (smells like wet dog)",
        "zone A vs. zone Z",
        "Cloud City (Oxygen subscription required)",
        "a rustic city",
        "Radioactive Forest of Death",
        "rickety bridges between skyscrapers",
        "spooky lab with flickering lights",
        "Too Cold To Live: The City",
        "underground bunker #404",
        "the super high-tech lab that somehow allows the virus to leak very easily",
      ];

      const times = [
        "Tuesday, next week (economy bad)",
        "2099 (everything is chrome)",
        "the Year of Our AI Overlord",
        "post-Super-Flu Era",
        "100 years after aliens laughed at us",
        "day 1 of the New Regime",
        "timeline confusingly similar to now",
        "the Age of Beige Uniforms",
        "Mars (Earth is a parking lot.)",
        "alternate 1985",
      ];

      const traumas = [
        "parents taken by men in masks",
        "house blew up (character building!)",
        "boarding school for sad children",
        "starved a little bit",
        "exiled for having blue hair",
        "bubble boy/girl upbringing",
        "accidental snitch",
        "survived the 'Great Purge'",
        "brainwashed by TV commercials",
        "tested on like a lab rat",
      ];

      const obstacles = [
        "drones with bad aim",
        "acid rain / toxic fog",
        "top 10 Anime Betrayals",
        "vending machine out of water",
        "road closed (construction forever)",
        "the bomb timer is ticking",
        "mum calls via hologram to guilt trip",
        "the laser gun jammed",
        "main character gets betrayed",
        "existential dread",
        "the rabbit chewed through the cable!",
      ];

      function getItems(array, count) {
        const shuffled = array.sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
      }

      function generateNightmare() {
        const out = document.getElementById("output");
        document.body.classList.remove("intro");
        document.body.classList.add("activated");

        // Generate Data
        const pChars = getItems(protagTraits, 3);
        const pWeak = getItems(protagWeakness, 1);
        const aChars = getItems(antagonist, 3);
        const aWeak = getItems(antagWeakness, 1);
        const sChars = getItems(sideChars, 3);
        const set = getItems(settings, 1);
        const time = getItems(times, 1);
        const trau = getItems(traumas, 1);
        const obs = getItems(obstacles, 2);

        // Construct HTML
        let html = `
                <div class="section">
                    <div class="label">>> THE HERO</div>
                    <ul>
                        ${pChars.map((i) => `<li>${i}</li>`).join("")}
                        <li style="color:var(--error)">WEAK: ${pWeak}</li>
                        <li style="color:var(--accent-warn)">TRAUMA: ${trau}</li>
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> THE VILLAIN</div>
                    <ul>
                        ${aChars.map((i) => `<li>${i}</li>`).join("")}
                        <li style="color:var(--error)">WEAK: ${aWeak}</li>
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> THE SQUAD</div>
                    <ul>
                        ${sChars.map((i) => `<li>${i}</li>`).join("")}
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> THE SETTING</div>
                    <ul>
                        <li>WHEN: ${time}</li>
                        <li>WHERE: ${set}</li>
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> OBSTACLES</div>
                    <ul>
                        ${obs.map((i) => `<li>${i}</li>`).join("")}
                    </ul>
                </div>
            `;

        out.innerHTML = html;
        out.style.display = "block";

        // Smooth scroll to results (setTimeout ensures rendering finishes)
        setTimeout(() => {
          window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
        }, 100);
      }
    </script>
  </body>
</html>
