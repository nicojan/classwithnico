<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Pocket Dystopia" />
    <meta property="og:title" content="Pocket Dystopia" />
    <meta
      property="og:description"
      content="Generate a satirical dystopian story seed with a single roll."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/nicojan/classwithnico/refs/heads/main/Development/pocket-dystopia/og-image-v1.png"
    />
    <meta
      property="og:url"
      content="https://classwith.nicojan.com/pocket-dystopia/"
    />
    <meta property="twitter:card" content="summary_large_image" />
    <title>Pocket Dystopia</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body class="intro">
    <header class="hero">
      <h1 class="flicker">POCKET DYSTOPIA</h1>
    </header>

    <div class="container">
      <div id="output" class="result-area"></div>
    </div>

    <!-- Floating d20 die button -->
    <button
      class="die-btn"
      onclick="generateNightmare()"
      aria-label="Roll the die"
    >
      <svg
        class="die-icon"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- d20 icosahedron shape -->
        <polygon
          points="50,5 95,35 82,88 18,88 5,35"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
        />
        <!-- Inner triangulation lines -->
        <line
          x1="50"
          y1="5"
          x2="18"
          y2="88"
          stroke="currentColor"
          stroke-width="1.2"
        />
        <line
          x1="50"
          y1="5"
          x2="82"
          y2="88"
          stroke="currentColor"
          stroke-width="1.2"
        />
        <line
          x1="5"
          y1="35"
          x2="82"
          y2="88"
          stroke="currentColor"
          stroke-width="1.2"
        />
        <line
          x1="95"
          y1="35"
          x2="18"
          y2="88"
          stroke="currentColor"
          stroke-width="1.2"
        />
        <line
          x1="5"
          y1="35"
          x2="95"
          y2="35"
          stroke="currentColor"
          stroke-width="1.2"
        />
        <!-- Center number -->
        <text
          id="die-num"
          x="50"
          y="58"
          text-anchor="middle"
          fill="currentColor"
          font-size="22"
          font-family="VT323, monospace"
        >
          20
        </text>
      </svg>
    </button>

    <footer class="site-footer">
      built with ♥ by
      <a href="https://nicojan.com" target="_blank" rel="noopener">Nico Jan</a>
    </footer>

    <script>
      // DATA SETS - The Satirical Collection
      const sideChars = [
        "loyal but terrified (Red Shirt #1)",
        "secretly resistance (has a cool tattoo)",
        "annoyingly optimistic despite acid rain",
        "scavenger who hoards spoons",
        "ex-Gov worker: 'I shouldn't say this...'",
        "medic who uses dirty bandages",
        "elder: 'I remember trees...'",
        "tech-kid (fixes fusion drives with gum)",
        "silent brooding type (low budget)",
        "citizen who reads the Terms of Service",
        "the musician who is tone deaf",
      ];

      const protagTraits = [
        "found a book, now thinks they are 'The One'",
        "too empathetic for this cruel world",
        "parkour expert (run. jump. repeat.)",
        "can hack the mainframe in < 3 seconds",
        "rebellious streak (hates beige)",
        "obnoxious sense of justice",
        "thinking fast, acting stupid",
        "the 'Chosen One' (Generic Variant B)",
        "has a robot arm or glowy eye",
        "super young but somehow can fix and do everything",
        "must find THE TRUTH (Caps Lock on)",
      ];

      const protagWeakness = [
        "trusts the villain immediately",
        "abandonment issues (classic)",
        "guilt over Chapter 1",
        "punches walls when angry",
        "physically frail but has 'heart'",
        "thinks they are invincible (spoiler: no)",
        "will die for their cat",
        "cannot follow simple instructions",
        "panic attacks triggered by beeping",
        "trackable via their microchip",
      ];

      const antagonist = [
        "chad dictator with great hair",
        "a corrupted leader that takes control of a city",
        "tech-bro uploading brains to the cloud",
        "angry general shouting at screens",
        "CEO of Water™",
        "scientist: 'I'm saving humanity by killing it'",
        "an evil robot who wants to destroy the world",
        "politician hiding aliens",
        "an alien emperor who wants to take over the planet",
        "AI who decides that in order to save humanity they must destroy humanity",
        "the giant dragon who is, for some reason, always evil",
      ];

      const antagWeakness = [
        "monologues their plan",
        "ignored 'The Power of Friendship'",
        "forgot to update the firewall",
        "minions are unionizing",
        "OCD about symmetry",
        "fragile ego (hates bad Yelp reviews)",
        "actually 3 kids in a trench coat",
        "secretly loves the hero's mum",
        "hiding a mutated tail",
        "relies on Windows 95",
      ];

      const settings = [
        "Sector 7 (It's always Sector 7)",
        "the tunnels (smells like wet dog)",
        "zone A vs. zone Z",
        "Cloud City (Oxygen subscription required)",
        "a rustic city",
        "Radioactive Forest of Death",
        "rickety bridges between skyscrapers",
        "spooky lab with flickering lights",
        "Too Cold To Live: The City",
        "underground bunker #404",
        "the super high-tech lab that somehow allows the virus to leak very easily",
      ];

      const times = [
        "Tuesday, next week (economy bad)",
        "2099 (everything is chrome)",
        "the Year of Our AI Overlord",
        "post-Super-Flu Era",
        "100 years after aliens laughed at us",
        "day 1 of the New Regime",
        "timeline confusingly similar to now",
        "the Age of Beige Uniforms",
        "Mars (Earth is a parking lot.)",
        "alternate 1985",
      ];

      const traumas = [
        "parents taken by men in masks",
        "house blew up (character building!)",
        "boarding school for 'sad' children",
        "skipped breakfast this morning",
        "exiled for having blue hair",
        "bubble boy/girl upbringing",
        "accidental snitch",
        "survived the 'Great Purge'",
        "brainwashed by TV commercials",
        "tested on like a lab rat",
      ];

      const obstacles = [
        "drones with bad aim",
        "acid rain / toxic fog",
        "top 10 Anime Betrayals",
        "vending machine out of water",
        "road closed (construction forever)",
        "The bomb timer is ticking.",
        "Mum calls via hologram to guilt trip.",
        "The laser gun jammed.",
        "existential dread",
        "The rabbit chewed through the cable!",
      ];

      function getItems(array, count) {
        const shuffled = array.sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
      }

      let hasRolled = false;
      let lastRollClass = "";

      const dieRollClasses = [
        "die-roll-x",
        "die-roll-neg-x",
        "die-roll-y",
        "die-roll-neg-y",
        "die-roll-diagonal",
      ];

      function buildHTML() {
        const pChars = getItems(protagTraits, 3);
        const pWeak = getItems(protagWeakness, 1);
        const aChars = getItems(antagonist, 3);
        const aWeak = getItems(antagWeakness, 1);
        const sChars = getItems(sideChars, 3);
        const set = getItems(settings, 1);
        const time = getItems(times, 1);
        const trau = getItems(traumas, 1);
        const obs = getItems(obstacles, 2);

        return `
                <div class="section">
                    <div class="label">>> THE HERO</div>
                    <ul>
                        ${pChars.map((i) => `<li>${i}</li>`).join("")}
                        <li style="color:var(--error)">WEAK: ${pWeak}</li>
                        <li style="color:var(--accent-warn)">TRAUMA: ${trau}</li>
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> THE VILLAIN</div>
                    <ul>
                        ${aChars.map((i) => `<li>${i}</li>`).join("")}
                        <li style="color:var(--error)">WEAK: ${aWeak}</li>
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> THE SQUAD</div>
                    <ul>
                        ${sChars.map((i) => `<li>${i}</li>`).join("")}
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> THE SETTING</div>
                    <ul>
                        <li>WHEN: ${time}</li>
                        <li>WHERE: ${set}</li>
                    </ul>
                </div>

                <div class="section">
                    <div class="label">>> OBSTACLES</div>
                    <ul>
                        ${obs.map((i) => `<li>${i}</li>`).join("")}
                    </ul>
                </div>
            `;
      }

      // Magical number cycling on the die
      const dieNumEl = document.getElementById("die-num");
      let idleCycleId = null;

      // Slow idle cycle — number changes every 2s for an eerie, alive feel
      function startIdleCycle() {
        stopIdleCycle();
        idleCycleId = setInterval(() => {
          dieNumEl.textContent = Math.floor(Math.random() * 20) + 1;
        }, 600);
      }

      function stopIdleCycle() {
        if (idleCycleId) {
          clearInterval(idleCycleId);
          idleCycleId = null;
        }
      }

      // Fast spin cycle during roll — numbers blur past
      function rollNumberCycle(duration) {
        stopIdleCycle();
        const end = Date.now() + duration;
        function tick() {
          dieNumEl.textContent = Math.floor(Math.random() * 20) + 1;
          if (Date.now() < end) {
            requestAnimationFrame(tick);
          } else {
            // Land on a final number, then resume idle
            dieNumEl.textContent = Math.floor(Math.random() * 20) + 1;
            startIdleCycle();
          }
        }
        requestAnimationFrame(tick);
      }

      // Start the idle cycle on load
      startIdleCycle();

      let isRolling = false;

      function generateNightmare() {
        if (isRolling) return; // prevent spam clicks during animation
        isRolling = true;

        const out = document.getElementById("output");
        const container = document.querySelector(".container");
        const dieBtn = document.querySelector(".die-btn");

        document.body.classList.remove("intro");
        document.body.classList.add("activated");

        // Animate the die: roll off right, come back from left
        dieBtn.classList.remove("rolling");
        void dieBtn.offsetWidth; // force reflow
        dieBtn.classList.add("rolling");

        // Fast number cycling for the duration of the roll animation
        rollNumberCycle(900);

        // Remove rolling class when animation ends
        dieBtn.addEventListener(
          "animationend",
          () => {
            dieBtn.classList.remove("rolling");
            isRolling = false;
          },
          { once: true },
        );

        if (!hasRolled) {
          // First roll: CRT boot-up
          out.innerHTML = buildHTML();
          out.style.display = "block";
          container.classList.add("crt-boot");
          hasRolled = true;
        } else {
          // Subsequent rolls: die tumble with random direction
          // Remove previous animation class
          container.classList.remove("crt-boot");
          if (lastRollClass) container.classList.remove(lastRollClass);

          // Pick a random direction, avoid repeating the same one
          let rollClass;
          do {
            rollClass =
              dieRollClasses[Math.floor(Math.random() * dieRollClasses.length)];
          } while (rollClass === lastRollClass && dieRollClasses.length > 1);
          lastRollClass = rollClass;

          // Force reflow so animation restarts
          void container.offsetWidth;
          container.classList.add(rollClass);

          // Swap content at midpoint of the animation (when face is hidden)
          const html = buildHTML();
          setTimeout(() => {
            out.innerHTML = html;
          }, 325);
        }

        // Smooth scroll to results
        setTimeout(() => {
          window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
        }, 100);
      }
    </script>
  </body>
</html>
