backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # TODO: change
  branch: main
  base_url: https://oauth.example.com         # TODO: your OAuth Worker domain
  auth_endpoint: /auth
  cms_label_prefix: "[CMS]"

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

site_url: https://blog.example.com            # TODO: update
display_url: https://blog.example.com

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
